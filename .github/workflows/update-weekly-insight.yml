name: Update weekly insight

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Monday 00:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh _data/active_insight.yml
        run: python3 .github/scripts/update_weekly_insight.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/active_insight.yml
          if git diff --staged --quiet; then
            echo "No changes to active insight."
          else
            git commit -m "chore: rotate weekly insight"
            git push
          fi
